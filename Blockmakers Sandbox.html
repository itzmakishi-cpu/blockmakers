.sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid #fff6}
.sw.on{border-color:#fff}
select{font:inherit;background:var(--panel);color:var(--fg);border:0;border-radius:10px;padding:8px}
button.on{border-color:var(--ac);color:var(--ac)}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center}
#hud{margin-left:auto;background:var(--panel);padding:8px 12px;border-radius:12px;font-size:14px}
#pal{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}

#btns{display:flex;flex-direction:column;gap:10px;pointer-events:auto}

#pal button{padding:8px 10px;font-size:13px}

:root{--panel:rgba(14,20,30,.78);--ac:#ffb000}
#help{display:none}
button{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03)),var(--panel);border:1px solid rgba(255,255,255,.14)}

#pal{flex-direction:column;align-items:center;flex-wrap:nowrap;gap:6px;pointer-events:none}

#tabs{display:flex;gap:6px;overflow-x:auto}

.card img{width:62px;height:62px}
.card span{font-size:11px;font-weight:700}
#rail{position:fixed;right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#tools{top:112px}

#set.show{display:block}
#set h3{margin:0 0 6px;font-size:18px}

#set label{display:grid;grid-template-columns:116px 1fr 46px;gap:8px;align-items:center;margin:8px 0;font-size:14px}

.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px 4px}

#top{flex-wrap:wrap}
